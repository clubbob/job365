name: Daily job crawl

on:
  schedule:
    # 한국 06:00 = UTC 21:00 (전날)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 비용 최소: 하루 1회·최대 2시간 (GitHub Actions 분). Vercel 함수는 사용하지 않음.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      - name: Run crawl pipeline
        run: pnpm crawl
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CRAWLER_USE_SAMPLES: 'false'
          CRAWL_MID_SIZED_BATCH_SIZE: '900'
          CRAWL_MID_SIZED_DB_BATCH_SIZE: '900'
