name: Job crawl (Mon Wed Fri)

on:
  schedule:
    # 한국 월·수·금 02:00 = UTC 일·화·목 17:00 — src/lib/crawler/schedule.ts CRAWL_CRON_UTC
    - cron: '0 17 * * 0,2,4'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 주 3회·중견 2,000곳. 3시간 안에 끝내 제한으로 회차 전체가 취소되지 않게 합니다.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium --with-deps

      - name: Run crawl pipeline
        run: pnpm crawl
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CRAWLER_USE_SAMPLES: 'false'
          # src/lib/crawler/schedule.ts CRAWL_MID_SIZED_SITES_PER_RUN 과 동일
          CRAWL_MID_SIZED_BATCH_SIZE: '2000'
          CRAWL_MID_SIZED_DB_BATCH_SIZE: '2000'
          CRAWL_SOURCE_DELAY_MS: '1200'
          CRAWL_REQUEST_GAP_MS: '300'
          WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
          WORK24_BULK_MAX_PAGES: '400'
